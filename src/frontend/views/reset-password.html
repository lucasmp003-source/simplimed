<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña - GALENO-IA</title>
    <!-- BASE_PLACEHOLDER -->
    <link rel="stylesheet" href="public/css/global_styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="public/css/auth.css" />
</head>

<body>
    <!-- Fondo animado -->
    <div class="neural-background">
        <canvas id="neuralCanvas" class="neural-network"></canvas>

        <!-- Línea de latido cardíaco -->
        <div class="heartbeat-line">
            <div class="ecg-line"></div>
            <svg class="ecg-pulse" viewBox="0 0 200 100" preserveAspectRatio="none">
                <polyline points="0,50 40,50 50,20 60,80 70,50 80,50 90,40 100,60 110,50 200,50" fill="none"
                    stroke="rgba(217, 83, 79, 0.8)" stroke-width="2" />
            </svg>
        </div>

        <!-- Partículas flotantes -->
        <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="top: 40%; left: 80%; animation-delay: 2s;"></div>
        <div class="particle" style="top: 60%; left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="top: 80%; left: 70%; animation-delay: 6s;"></div>
        <div class="particle" style="top: 30%; left: 50%; animation-delay: 1s;"></div>
        <div class="particle" style="top: 70%; left: 20%; animation-delay: 3s;"></div>
        <div class="particle" style="top: 50%; left: 90%; animation-delay: 5s;"></div>
    </div>

    <!-- Tarjeta de reset password -->
    <div
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div class="reset-password-card">
            <div class="simple-header">
                <h1>GALENO<span class="ia-suffix">-IA</span></h1>
                <p>Restablecer Contraseña</p>
                <p class="description" id="user-email-display"></p>
            </div>

            <!-- Validando token... -->
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Verificando enlace...</p>
            </div>

            <!-- Token inválido o expirado -->
            <div id="invalid-token" class="token-status" style="display: none;">
                <div class="token-error">
                    <span class="error-icon-large">⚠️</span>
                    <h3>Enlace Inválido o Expirado</h3>
                    <p id="invalid-token-message">El enlace de recuperación no es válido o ha expirado.</p>
                    <a href="forgot-password">Solicitar Nuevo Enlace</a>
                </div>
            </div>

            <!-- Formulario de reseteo -->
            <form id="reset-password-form" class="simple-form" autocomplete="off" style="display: none;">
                <div class="form-group">
                    <label for="password">Nueva Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6"
                        autocomplete="new-password" aria-label="Nueva contraseña" />
                    <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">
                        👁️
                    </button>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required
                        minlength="6" autocomplete="new-password" aria-label="Confirmar contraseña" />
                    <button type="button" class="toggle-password" id="toggle-confirm-password"
                        aria-label="Mostrar contraseña">
                        👁️
                    </button>
                </div>

                <div class="password-requirements">
                    <p><small>La contraseña debe tener al menos 6 caracteres</small></p>
                </div>

                <button type="submit" id="btn-submit">
                    <span>Restablecer Contraseña</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>

                <div class="success-message" id="success-message" style="display: none;">
                    <span id="success-text"></span>
                </div>

                <div class="error-message" id="error-message" style="display: none;">
                    <span id="error-text"></span>
                </div>
            </form>

            <div class="simple-footer">
                <a href="login">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="public/js/neural-network.js"></script>
    <script src="public/js/reset-password.js"></script>
    <script src="config.js"></script>
    <script src="public/js/url-helper.js"></script>
</body>

</html>
