<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALENO-IA: Generación de Informes de Alta</title>
    <!-- BASE_PLACEHOLDER -->
    <link rel="stylesheet" href="public/css/global_styles.css" />
    <link rel="stylesheet" href="public/css/chatbot.css?v=2" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="public/css/tools.css" />
    <link rel="stylesheet" href="public/css/footer.css?v=robust" />
</head>

<body class="auth-protected">

    <!-- Animated Background -->
    <div class="background-effects">
        <div class="gradient-orb"></div>
        <div class="gradient-orb"></div>
        <div class="gradient-orb"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- HEADER_PLACEHOLDER -->

    <main class="main-container">
        <!-- Title with Sparkle Effect -->
        <div class="hero-title-wrapper" id="hero-title-wrapper">
            <div class="title-particles" id="title-particles"></div>
            <h1>Generación de Informes de Alta</h1>
        </div>
        <p class="description">Sube la hoja de evolución y la hoja de anamnesis para generar automáticamente el informe
            de alta.</p>

        <div class="upload-section">
            <!-- Hoja de Evolución -->
            <div class="upload-card" id="evolution-row" onclick="document.getElementById('evolution-input').click();"
                title="Haz clic para subir la hoja de evolución">
                <div class="card-particles" id="evolution-particles"></div>
                <div class="icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <rect x="9" y="3" width="6" height="4" rx="1" stroke-linecap="round" stroke-linejoin="round" />
                        <line x1="9" y1="12" x2="15" y2="12" stroke-linecap="round" />
                        <line x1="9" y1="16" x2="13" y2="16" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="file-info">
                    <div class="label">Hoja de Evolución</div>
                    <div class="status" id="evolution-status">Haz clic para seleccionar un PDF</div>
                </div>
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <input type="file" id="evolution-input" accept=".pdf" hidden />
            </div>

            <!-- Hoja de Anamnesis -->
            <div class="upload-card" id="anamnesis-row" onclick="document.getElementById('anamnesis-input').click();"
                title="Haz clic para subir la hoja de anamnesis">
                <div class="card-particles" id="anamnesis-particles"></div>
                <div class="icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <polyline points="14,2 14,8 20,8" stroke-linecap="round" stroke-linejoin="round" />
                        <line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round" />
                        <line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round" />
                        <polyline points="10,9 9,9 8,9" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="file-info">
                    <div class="label">Hoja de Anamnesis</div>
                    <div class="status" id="anamnesis-status">Haz clic para seleccionar un PDF</div>
                </div>
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <input type="file" id="anamnesis-input" accept=".pdf" hidden />
            </div>
        </div>

        <p class="status-message" id="status-message"></p>
        <p class="loading-message" id="loading-message" style="display: none;">
            <span class="loader" aria-label="Cargando"></span>
        </p>


    </main>

    <!-- FOOTER_PLACEHOLDER -->

    <script src="config.js"></script>
    <script src="public/js/chatbot.js"></script>
    <script src="public/js/url-helper.js"></script>
    <script src="public/js/generate.js"></script>
    <script src="public/js/auth.js"></script>

    <!-- Interactive Sparkle Effects -->
    <script src="public/js/effects.js"></script>
</body>

</html>
