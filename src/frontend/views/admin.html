<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - GALENO-IA</title>
    <link rel="icon" href="public/images/favicon.ico" type="image/x-icon">
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="public/css/global_styles.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="public/css/dashboard.css">
    <link rel="stylesheet" href="public/css/footer.css?v=robust">
</head>

<body>
    <!-- HEADER_PLACEHOLDER -->

    <div class="account-main">
        <div class="account-header">
            <h1>Panel de Administración</h1>
            <p class="account-subtitle">Gestión de usuarios y permisos del sistema</p>
        </div>

        <div class="admin-container">
            <!-- Barra de acciones -->
            <div class="admin-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="userDetailsSearch" placeholder="Buscar usuario...">
                </div>
                <button class="btn-primary" onclick="openCreateModal()">
                    <i class="fas fa-plus"></i> Nuevo Usuario
                </button>
            </div>

            <!-- Tabla de Usuarios -->
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Institución</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Las filas se generarán aquí -->
                        <tr>
                            <td colspan="6" class="text-center">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Usuario -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeUserModal()">&times;</span>
            <h2 id="modalTitle">Invitar Usuario</h2>
            <form id="userForm" class="admin-form">
                <input type="hidden" id="userId">

                <!-- Campos solo para edición -->
                <div class="form-row" id="nameRow" style="display: none;">
                    <div class="form-group">
                        <label for="firstName">Nombre</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Apellidos</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="role">Rol</label>
                        <select id="role" name="role" required>
                            <option value="user">Doctor (Usuario)</option>
                            <option value="tester">Tester</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="institution">Institución</label>
                        <input type="text" id="institution" name="institution">
                    </div>
                </div>

                <!-- Campos solo para edición -->
                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label for="password" id="passwordLabel">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
                        <button type="button" class="toggle-password" onclick="toggleModalPassword()">
                            <i class="fas fa-eye" id="modalEyeIcon"></i>
                        </button>
                    </div>
                    <small class="help-text" id="passwordHelp">Dejar en blanco para mantener la actual.</small>
                </div>

                <p id="inviteHelpText" style="color: #6c757d; font-size: 0.85rem; margin-bottom: 1rem;">Se enviará un
                    email de invitación al usuario para que complete su registro.</p>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeUserModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="saveUserBtn">📧 Enviar Invitación</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER_PLACEHOLDER -->

    <script src="config.js"></script>
    <script src="public/js/url-helper.js"></script>
    <script src="public/js/auth.js"></script>
    <script src="public/js/admin.js"></script>
</body>

</html>
