<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - GALENO-IA</title>
    <!-- BASE_PLACEHOLDER -->

    <link rel="stylesheet" href="public/css/global_styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="public/css/auth.css" />
</head>

<body>
    <!-- Fondo animado -->
    <div class="neural-background">
        <canvas id="neuralCanvas" class="neural-network"></canvas>

        <!-- Línea de latido cardíaco -->
        <div class="heartbeat-line">
            <div class="ecg-line"></div>
            <svg class="ecg-pulse" viewBox="0 0 200 100" preserveAspectRatio="none">
                <polyline points="0,50 40,50 50,20 60,80 70,50 80,50 90,40 100,60 110,50 200,50" fill="none"
                    stroke="rgba(217, 83, 79, 0.8)" stroke-width="2" />
            </svg>
        </div>

        <!-- Partículas flotantes -->
        <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="top: 40%; left: 80%; animation-delay: 2s;"></div>
        <div class="particle" style="top: 60%; left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="top: 80%; left: 70%; animation-delay: 6s;"></div>
        <div class="particle" style="top: 30%; left: 50%; animation-delay: 1s;"></div>
        <div class="particle" style="top: 70%; left: 20%; animation-delay: 3s;"></div>
        <div class="particle" style="top: 50%; left: 90%; animation-delay: 5s;"></div>
    </div>

    <!-- Tarjeta de login simplificada -->
    <div
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div class="login-card">
            <div class="simple-header">
                <h1>GALENO<span class="ia-suffix">-IA</span></h1>
                <p>Sistema Inteligente de Cardiología</p>
            </div>

            <form id="login-form" class="simple-form" autocomplete="on">
                <input type="email" id="email" name="email" placeholder="Correo electrónico" required
                    autocomplete="email" />

                <input type="password" id="password" name="password" placeholder="Contraseña" required
                    autocomplete="current-password" />

                <!-- Elementos ocultos pero necesarios para el JS -->
                <input type="checkbox" id="remember-me" name="remember-me" style="display: none;" />
                <button type="button" id="toggle-password" style="display: none;"></button>

                <button type="submit" id="btn-login">
                    <span>Iniciar Sesión</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>

                <div class="error-message" id="error-message">
                    <span id="error-text"></span>
                </div>
            </form>

            <div class="simple-footer">
                <a href="forgot-password" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <script src="public/js/neural-network.js"></script>
    <script src="config.js"></script>
    <script src="public/js/url-helper.js"></script>
    <script src="public/js/auth.js"></script>
</body>

</html>
