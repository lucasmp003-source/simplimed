<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización Generación - GALENO-IA</title>
    <!-- BASE_PLACEHOLDER -->
    <link rel="stylesheet" href="public/css/global_styles.css">
    <link rel="stylesheet" href="public/css/floating-buttons.css">
    <link rel="stylesheet" href="public/css/chatbot.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="public/css/preview.css">
    <link rel="stylesheet" href="public/css/footer.css?v=robust">
</head>


<body class="auth-protected">

    <!-- HEADER_PLACEHOLDER -->

    <!-- Botones flotantes: Editar y Descargar -->
    <div id="floating-buttons" class="floating-buttons-wrapper">
        <button id="edit-toggle-btn" class="floating-btn"
            style="background-color: #f0ad4e; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); transition: all 0.3s ease; opacity: 0.85;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 6px;">
                <path
                    d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
            </svg>
            <span id="edit-toggle-text">Editar</span>
        </button>

        <button id="simplify-btn" class="floating-btn" disabled title="Esperando a que concluya la generación"
            style="background-color: #6f42c1; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: not-allowed; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); transition: all 0.3s ease; opacity: 0.4;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                <polyline points="4 14 10 14 10 20"></polyline>
                <polyline points="20 10 14 10 14 4"></polyline>
                <line x1="14" y1="10" x2="21" y2="3"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            Simplificar
        </button>

        <button id="download-btn" class="floating-btn" disabled title="Esperando a que concluya la generación"
            style="background-color: #9e9e9e; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: not-allowed; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); transition: all 0.3s ease; opacity: 0.4;">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="margin-right: 6px;">
                <path d="M13 8V2H7v6H2l8 8 8-8h-5zM0 18h20v2H0v-2z" />
            </svg>
            Descargar PDF
        </button>
    </div>

    <main class="preview-container">
        <div class="preview-wrapper">
            <!-- Panel de previsualización (izquierda) con tabs -->
            <div class="preview-panel">
                <div class="tabs-container">
                    <button class="tab-btn active" id="tab-evolution" data-tab="evolution">
                        📋 Hoja de Evolución
                    </button>
                    <button class="tab-btn" id="tab-anamnesis" data-tab="anamnesis">
                        📝 Hoja de Anamnesis
                    </button>
                </div>
                <div id="pdf-canvas-container">
                    <div class="document-content active" id="evolution-content"></div>
                    <div class="document-content" id="anamnesis-content"></div>
                </div>
            </div>

            <!-- Panel de acciones (derecha) -->
            <div class="actions-panel" style="padding: 0;">
                <!-- Header removed as per user request -->

                <div class="output-area full-height" id="output-area">
                    <div class="output-placeholder full-height" id="output-placeholder">
                        <div class="action-buttons-group">
                            <button class="generate-btn" id="generate-btn">
                                ✨ Generar Informe de Alta
                            </button>
                            <button class="analyze-btn" id="analyze-btn">
                                🔬 Analizar Ingreso
                            </button>
                        </div>
                    </div>
                    <!-- Analysis Panel -->
                    <div id="analysis-panel" style="display: none;">
                        <div class="analysis-header">
                            <h3>🔬 Análisis de Valores Clínicos</h3>
                            <button class="analysis-back-btn" id="analysis-back-btn">← Volver</button>
                        </div>
                        <div id="analysis-loading" class="analysis-loading" style="display: none;">
                            <div class="analysis-spinner"></div>
                            <p>Analizando hoja de evolución con IA...</p>
                            <p class="analysis-subtitle">Extrayendo valores clínicos de cada registro</p>
                        </div>
                        <div id="analysis-error" class="analysis-error" style="display: none;"></div>
                        <div id="analysis-selector" class="analysis-selector" style="display: none;">
                            <div class="selector-header">
                                <p>Selecciona las variables que deseas visualizar:</p>
                                <div class="selector-actions">
                                    <button class="selector-action-btn" id="select-all-btn">Seleccionar todo</button>
                                    <button class="selector-action-btn" id="deselect-all-btn">Deseleccionar
                                        todo</button>
                                </div>
                            </div>
                            <div id="variables-grid" class="variables-grid"></div>
                            <button class="view-charts-btn" id="view-charts-btn" disabled>
                                📊 Ver Gráficas
                            </button>
                        </div>
                        <div id="charts-container" class="charts-container" style="display: none;"></div>
                    </div>
                    <div id="output-content" style="display: none;"></div>
                    <textarea id="edit-textarea"
                        style="display: none; width: 100%; height: calc(100vh - 150px); padding: 1rem; border: 1px solid #ccc; border-radius: 8px; font-family: 'Courier New', monospace; resize: none; font-size: 14px; line-height: 1.6; box-sizing: border-box;"></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- Widget de Logs Flotante (Abajo a la derecha) -->
    <div id="log-widget" class="log-widget" style="display: none;">
        <div class="log-header" id="log-toggle">
            <span id="log-status-text">Generando...</span>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="log-body" id="progress-logs">
            <!-- Logs se inyectan aquí -->
        </div>
    </div>

    <!-- Chatbot Interface injected by chatbot.js -->

    <!-- FOOTER_PLACEHOLDER -->

    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown/lib/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="config.js"></script>
    <script src="public/js/url-helper.js"></script>
    <script src="public/js/auth.js"></script>
    <script src="public/js/chatbot.js"></script>
    <script src="public/js/preview-generar.js"></script>
</body>

</html>
